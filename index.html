<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ultraspeaker Projector Lab</title>
<meta name="description" content="Set up the projector before you speak: a 10-step guide with test patterns for format, focus, black, white, colour and clinical references.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-title" content="Projector Lab">
<meta name="application-name" content="Projector Lab">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="assets/projector-lab-icon-32.png?v=5">
<link rel="apple-touch-icon" href="assets/projector-lab-icon-180.png?v=5">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="shared/ultraspeaker-lab.css?v=20261111b">
<link rel="stylesheet" href="css/app.css?v=20261111b">
<!-- Office.js: in PowerPoint collega il pannello alla presentazione; nel browser la pagina funziona anche senza -->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="shared/ultraspeaker-lang.js?v=20261111b"></script>
</head>
<body>
<div class="us-page us-page--narrow app">
  <header class="us-header">
    <div>
      <a class="us-logo" href="https://www.theultraspeaker.com" target="_blank" rel="noopener"><img src="assets/logo-projector-lab-white.svg?v=5" alt="The Ultraspeaker Projector Lab"></a>
      <p class="us-subtitle"><span class="us-dot"></span><span id="statusText"></span></p>
    </div>
    <div class="us-header-tools">
      <label class="us-lang">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <span class="us-sr" data-i18n="us.language"></span>
        <select id="lang"></select>
      </label>
      <a class="us-btn us-guide" id="usGuide" href="guide/projector-lab-guide-en.pdf" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg><span data-i18n="us.guide"></span></a>
    </div>
  </header>

  <main id="main">
    <!-- Screen Test: inserimento nella presentazione (PowerPoint) o finestra / download (browser) -->
    <section class="us-panel pl-setup" id="setup">
      <div class="pl-setup-head">
        <p class="us-label" data-i18n="setup.h"></p>
        <div class="pl-done" id="setupDone" hidden><i></i><span id="setupDoneText"></span></div>
        <button type="button" id="setupToggle" aria-expanded="true" data-i18n-aria="setup.h"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
      <div class="pl-setup-body">
        <p class="pl-note" id="setupText"></p>
        <div class="pl-row">
          <span data-i18n="format"></span>
          <div class="pl-chips" id="fmtSeg" role="group" data-i18n-aria="format"></div>
        </div>
        <p class="pl-note" id="fmtHint"></p>
        <div class="pl-row office-only" id="whereRow">
          <span data-i18n="where"></span>
          <div class="pl-chips" id="whereSeg" role="group" data-i18n-aria="where">
            <button type="button" class="us-chip" data-where="end" aria-pressed="true" data-i18n="where.end"></button>
            <button type="button" class="us-chip" data-where="start" aria-pressed="false" data-i18n="where.start"></button>
          </div>
        </div>
        <p class="us-note office-only" id="newPresHint" hidden></p>
        <div class="pl-btns office-only">
          <button type="button" class="us-btn" id="insertBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M12 9v5M9.5 11.5h5"/></svg><span id="insertLabel" data-i18n="insert"></span></button>
          <button type="button" class="us-btn is-warn" id="removeBtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span data-i18n="remove"></span></button>
        </div>
        <div class="pl-btns">
          <button type="button" class="us-btn" id="windowBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span id="windowLabel" data-i18n="window"></span></button>
          <button type="button" class="us-btn web-only" id="downloadBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"/></svg><span data-i18n="download"></span></button>
        </div>
        <p class="pl-note office-only" id="windowHint" data-i18n="windowHint"></p>
      </div>
    </section>

    <div class="pl-progress" aria-hidden="true"><i id="progress"></i></div>
    <nav class="pl-stepper" id="stepper"></nav>
    <div class="pl-restart-row"><button type="button" class="pl-restart is-left web-only" id="resetAllBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span id="resetAllLabel"></span></button><button type="button" class="pl-restart" id="restartBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg><span id="restartLabel"></span></button></div>

    <article class="pl-step" id="step"></article>
  </main>

  <footer class="us-footer">
    <a class="us-cta" id="usCta" href="mailto:info@theultraspeaker.com"><img src="assets/arena-white.svg" alt=""><span data-i18n="us.cta"></span></a>
    <p class="us-links"><a href="support.html" target="_blank" rel="noopener" data-i18n="us.support"></a><a href="privacy.html" target="_blank" rel="noopener" data-i18n="us.privacy"></a><a href="terms.html" target="_blank" rel="noopener" data-i18n="us.terms"></a><a href="GUIDA-INSTALLAZIONE.html" target="_blank" rel="noopener" data-i18n="us.install"></a></p>
  </footer>

  <div class="pl-foot">
    <button type="button" class="us-btn" id="prevBtn" data-i18n="prev"></button>
    <button type="button" class="us-btn us-btn--primary" id="nextBtn" data-i18n="next"></button>
  </div>
</div>
<iframe class="pl-viewer" id="viewer" title="Projector Lab" allow="fullscreen" hidden></iframe>
<input type="file" id="photoIn" accept="image/jpeg,image/png" hidden>
<div class="pl-toast" id="toast" role="status" aria-live="polite"></div>

<script src="i18n.js?v=20261111b"></script>
<script src="venn-data.js?v=20261111b"></script>
<script src="wm-data.js?v=20261111b"></script>
<script src="patterns.js?v=20261111b"></script>
<script src="vendor/pptxgen.bundle.js?v=20261111b" defer></script>
<script src="app.js?v=20261111b"></script>
</body>
</html>
