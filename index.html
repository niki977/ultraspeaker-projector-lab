<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ultraspeaker Projector Lab</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/projector-lab-icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/projector-lab-icon-16.png">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/projector-lab-icon-180.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#000000">
<!-- Office.js: in PowerPoint collega il pannello alla presentazione. Nel browser il pannello funziona come guida con i pattern a schermo intero. -->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
/* Quicksand (SIL Open Font License) dalla cartella fonts */
@font-face{font-family:"Quicksand";font-weight:400;font-display:swap;src:url(fonts/quicksand-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Quicksand";font-weight:500;font-display:swap;src:url(fonts/quicksand-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Quicksand";font-weight:600;font-display:swap;src:url(fonts/quicksand-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Quicksand";font-weight:700;font-display:swap;src:url(fonts/quicksand-latin-700-normal.woff2) format("woff2")}
:root{
  --bg:#000000; --surface:#0c0c0c; --surface-2:#141414; --ink:#ffffff; --ink-2:#d0d0d0; --ink-3:#8e8e8e;
  --line:#1f1f1f; --line-2:#2a2a2a; --line-3:#3a3a3a; --danger:#b3261e; --ok:#7ddc8a; --warn:#ffcf80;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:500 13px/1.45 "Quicksand","Avenir Next","Segoe UI",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid #ffffff;outline-offset:2px}
a{color:var(--ink-2)}
.app{min-height:100vh;display:flex;flex-direction:column}
body.web{background:#0a0a0a}
body.web .app{width:100%;max-width:760px;margin:0 auto;background:var(--bg);border-inline:1px solid var(--line)}

/* Intestazione */
.brand{flex:none;padding:14px 18px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.brand-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.lockup{display:block;width:min(200px,60%);height:auto;margin-top:2px}
.lang{display:flex;align-items:center;gap:6px;flex:none}
.lang svg{width:16px;height:16px;stroke:#9a9a9a;fill:none;stroke-width:1.8}
.lang select{height:30px;padding:0 6px;border-radius:7px;background:#111111;border:1px solid #333333;font-size:12px;font-weight:600}
.status{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#bdbdbd}
.status i{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.status.off i{background:#555555}
.status.busy i{background:var(--warn)}

.scroll{flex:1;padding:14px 18px 18px;display:flex;flex-direction:column;gap:16px}
.h{font-size:10.5px;font-weight:700;letter-spacing:.22em;color:var(--ink-3)}
.note{font-size:11.5px;line-height:1.5;color:var(--ink-3);margin:0}
.hint{font-size:11.5px;line-height:1.45;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px}
.hint.warn{border-color:#5a4a2a;color:#f3dfb6}
.sep{height:1px;background:var(--line);flex:none}
[hidden]{display:none!important}

/* Scheda Screen Test */
.card{border:1px solid var(--line-2);border-radius:12px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:10px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-head .h{white-space:nowrap}
.card-head .done{margin-left:auto;min-width:0}
.card-head button{background:none;border:0;color:var(--ink-3);padding:2px;display:flex}
.card-head svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;transition:transform .2s}
.card.closed .card-body{display:none}
.card.closed .card-head svg{transform:rotate(-90deg)}
.card-body{display:flex;flex-direction:column;gap:10px}
.done{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ok);font-weight:600}
.done i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.field{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;gap:8px}
.field > span{font-size:12px;font-weight:600;color:var(--ink-2)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.pill{height:28px;padding:0 10px;border-radius:14px;border:1px solid #333333;background:transparent;color:#bdbdbd;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill[aria-pressed="true"]{background:#ffffff;color:#000000;border-color:#ffffff}
.pill small{font-weight:600;opacity:.7;margin-left:4px}
.btn{min-height:38px;border-radius:9px;font-size:12.5px;font-weight:700;padding:7px 12px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.3;min-width:0}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;flex:none}
.btn.pri{background:#ffffff;color:#000000;border:1px solid #ffffff}
.btn.sec{background:transparent;border:1px solid var(--line-3)}
.btn.small{min-height:32px;padding:5px 10px;font-size:12px;font-weight:600}
.btn.danger{color:#ff9d96}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}
input[type=text],textarea{width:100%;background:#0f0f0f;border:1px solid #333333;border-radius:8px;padding:8px 10px;font-size:12.5px}
textarea{resize:vertical;min-height:62px}
input::placeholder,textarea::placeholder{color:#6f6f6f}

/* Passi */
.stepper{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.dot{height:30px;border-radius:7px;border:1px solid #333333;background:transparent;color:#bdbdbd;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.dot[aria-current="step"]{background:#ffffff;color:#000000;border-color:#ffffff}
.dot::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:transparent}
.dot.ok::after{background:var(--ok)}
.dot.fix::after{background:var(--warn)}
.dot.skip::after{background:#555555}
.progress{height:2px;background:var(--line-2);border-radius:1px;overflow:hidden}
.progress i{display:block;height:100%;background:#ffffff;transition:width .25s}
.step-head{display:flex;flex-direction:column;gap:4px}
.step-head h2{margin:0;font-size:19px;line-height:1.2;font-weight:700}
.goal{margin:0;color:var(--ink-2);font-size:13px}

/* Anteprime dei pattern del passo */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.thumb{display:flex;flex-direction:column;gap:5px;padding:0;background:none;border:0;text-align:left}
.thumb .img{width:100%;aspect-ratio:var(--ar,16/9);border-radius:6px;overflow:hidden;border:1px solid var(--line-3);background:#111111;transition:border-color .15s}
.thumb .img svg{display:block;width:100%;height:100%}
.thumb:hover .img,.thumb[aria-pressed="true"] .img{border-color:#ffffff}
.thumb span{font-size:11.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.thumb span svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2}

ul.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
ul.list li{position:relative;padding-left:16px;font-size:13px;line-height:1.45;color:#e8e8e8}
ul.list li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;border:1.5px solid #bdbdbd}
ul.list.adj li::before{border-radius:1px;transform:rotate(45deg);width:5px;height:5px;top:.65em}
.sec-block{display:flex;flex-direction:column;gap:8px}

.checks{display:flex;flex-direction:column;gap:6px}
.check{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start;font-size:13px;line-height:1.45;color:#e8e8e8;cursor:pointer;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.check:hover{background:var(--surface-2)}
.check input{appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:5px;border:1.5px solid #6a6a6a;margin:1px 0 0;display:grid;place-items:center;cursor:pointer}
.check input:checked{background:#ffffff;border-color:#ffffff}
.check input:checked::after{content:"";width:9px;height:5px;border:2px solid #000000;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.check input:checked + span{color:var(--ink-3)}

details.issue{border:1px solid var(--line-2);border-radius:9px;background:var(--surface)}
details.issue + details.issue{margin-top:6px}
details.issue summary{list-style:none;cursor:pointer;padding:9px 34px 9px 11px;font-size:12.5px;font-weight:700;position:relative;line-height:1.35}
details.issue summary::-webkit-details-marker{display:none}
details.issue summary::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid #9a9a9a;border-bottom:2px solid #9a9a9a;transform:translateY(-70%) rotate(45deg);transition:transform .2s}
details.issue[open] summary::after{transform:translateY(-30%) rotate(-135deg)}
details.issue p{margin:0;padding:0 11px 11px;font-size:12.5px;color:var(--ink-2);line-height:1.5}

.result{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.rb{height:36px;border-radius:9px;border:1px solid #333333;background:transparent;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px;white-space:nowrap}
.rb i{width:7px;height:7px;border-radius:50%;flex:none}
.rb.ok i{background:var(--ok)}.rb.fix i{background:var(--warn)}.rb.skip i{background:#666666}
.rb[aria-pressed="true"].ok{border-color:var(--ok);background:rgba(125,220,138,.12)}
.rb[aria-pressed="true"].fix{border-color:var(--warn);background:rgba(255,207,128,.12)}
.rb[aria-pressed="true"].skip{border-color:#777777;background:#1a1a1a}

.timer{font-variant-numeric:tabular-nums}
.report{font:500 11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;background:#0b0b0b;border:1px solid var(--line-2);border-radius:8px;padding:10px;color:#cfcfcf;margin:0;max-height:220px;overflow:auto}

.foot{flex:none;position:sticky;bottom:0;z-index:5;background:var(--bg);padding:12px 18px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px}
.fb{height:42px;border-radius:10px;font-size:12.5px;font-weight:700;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb.sec{background:transparent;border:1px solid var(--line-3)}
.fb.pri{background:#ffffff;color:#000000;border:1px solid #ffffff}

.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,12px);background:#ffffff;color:#000000;font-weight:700;font-size:12px;padding:9px 14px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px);text-align:center;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid #999999;border-top-color:#000000;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.links{margin:0}
@media (max-width:340px){.field{grid-template-columns:1fr}.result{grid-template-columns:1fr}}

/* Vista pattern integrata */
.viewer{position:fixed;inset:0;z-index:50;background:#000000}
.viewer .stage{position:absolute;inset:0}
.viewer .stage svg{display:block;width:100%;height:100%}
.viewer .vphoto{position:absolute;inset:0;background:#000000}
.viewer .vphoto img{width:100%;height:100%;object-fit:contain;display:block}
.viewer.idle{cursor:none}
.vbar{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:12px;background:rgba(12,12,12,.9);border:1px solid #2a2a2a;transition:opacity .3s;max-width:calc(100% - 24px)}
.vhelp{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:12px;color:#bdbdbd;background:rgba(12,12,12,.85);border:1px solid #2a2a2a;padding:6px 12px;border-radius:9px;transition:opacity .3s;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.viewer.idle .vbar,.viewer.idle .vhelp{opacity:0;pointer-events:none}
.vbar button{height:34px;min-width:34px;padding:0 10px;border-radius:8px;border:1px solid #333333;background:transparent;color:#ffffff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.vbar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.vname{padding:0 8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.vcount{color:#8e8e8e;font-variant-numeric:tabular-nums;padding-right:4px}
@media (max-width:520px){#vFsLabel{display:none}.vhelp{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="brand">
    <div class="brand-row">
      <img class="lockup" src="assets/logo-projector-lab-white.svg" alt="The Ultraspeaker Projector Lab">
      <label class="lang">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
        <select id="lang" data-i18n-aria="lang"></select>
      </label>
    </div>
    <div class="status off" id="status"><i></i><span id="statusText"></span></div>
  </header>

  <main class="scroll" id="main">
    <div class="hint warn" id="unsupported" hidden><b data-i18n="unsupported.title"></b><br><span data-i18n="unsupported.text"></span></div>

    <!-- Screen Test: inserimento nella presentazione (PowerPoint) o finestra / download (browser) -->
    <section class="card" id="setup">
      <div class="card-head">
        <div class="h" data-i18n="setup.h"></div>
        <div class="done" id="setupDone" hidden><i></i><span id="setupDoneText"></span></div>
        <button type="button" id="setupToggle" aria-expanded="true" data-i18n-aria="setup.h"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
      <div class="card-body">
        <p class="note" id="setupText"></p>
        <div class="field">
          <span data-i18n="format"></span>
          <div class="seg" id="fmtSeg" role="group" data-i18n-aria="format"></div>
        </div>
        <p class="note" id="fmtHint"></p>
        <div class="field office-only" id="whereRow">
          <span data-i18n="where"></span>
          <div class="seg" id="whereSeg" role="group" data-i18n-aria="where">
            <button type="button" class="pill" data-where="end" aria-pressed="true" data-i18n="where.end"></button>
            <button type="button" class="pill" data-where="start" aria-pressed="false" data-i18n="where.start"></button>
          </div>
        </div>
        <p class="hint office-only" id="newPresHint" hidden></p>
        <div class="btns office-only">
          <button type="button" class="btn pri" id="insertBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M12 9v5M9.5 11.5h5"/></svg><span id="insertLabel" data-i18n="insert"></span></button>
          <button type="button" class="btn sec small danger" id="removeBtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span data-i18n="remove"></span></button>
        </div>
        <div class="btns">
          <button type="button" class="btn sec small" id="windowBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span id="windowLabel" data-i18n="window"></span></button>
          <button type="button" class="btn sec small web-only" id="downloadBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"/></svg><span data-i18n="download"></span></button>
        </div>
        <p class="note" id="windowHint" data-i18n="windowHint"></p>
      </div>
    </section>

    <div class="progress" aria-hidden="true"><i id="progress"></i></div>
    <nav class="stepper" id="stepper"></nav>

    <article id="step" style="display:flex;flex-direction:column;gap:16px"></article>

    <p class="note links"><a href="support.html" target="_blank" rel="noopener" data-i18n="support"></a> · <a href="privacy.html" target="_blank" rel="noopener" data-i18n="privacy"></a> · <a href="terms.html" target="_blank" rel="noopener" data-i18n="terms"></a></p>
  </main>

  <footer class="foot">
    <button type="button" class="fb sec" id="prevBtn" data-i18n="prev"></button>
    <button type="button" class="fb pri" id="nextBtn" data-i18n="next"></button>
  </footer>
</div>
<div class="viewer" id="viewer" hidden>
  <div class="stage" id="vStage"></div>
  <div class="vphoto" id="vPhoto" hidden><img alt=""></div>
  <div class="vhelp" id="vHelp"></div>
  <div class="vbar" role="toolbar">
    <button type="button" id="vPrev" aria-label="←"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="vname" id="vName"></div><div class="vcount" id="vCount"></div>
    <button type="button" id="vNext" aria-label="→"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button type="button" id="vFs"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span id="vFsLabel"></span></button>
    <button type="button" id="vClose" aria-label="Esc"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
</div>
<input type="file" id="photoIn" accept="image/jpeg,image/png" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="i18n.js"></script>
<script src="venn-data.js"></script>
<script src="wm-data.js"></script>
<script src="patterns.js"></script>
<script src="vendor/pptxgen.bundle.js" defer></script>
<script src="app.js"></script>
</body>
</html>
