<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projector Lab – Screen Test</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta name="theme-color" content="#000000">
<!-- Office.js serve solo quando la finestra è aperta dal pannello di PowerPoint -->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
@font-face{font-family:"Quicksand";font-weight:600;font-display:swap;src:url(fonts/quicksand-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Quicksand";font-weight:700;font-display:swap;src:url(fonts/quicksand-latin-700-normal.woff2) format("woff2")}
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#000000;overflow:hidden}
body{font:600 13px/1.4 "Quicksand","Avenir Next","Segoe UI",-apple-system,sans-serif;color:#ffffff;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0}
#stage svg{display:block;width:100%;height:100%}
#photo{position:fixed;inset:0;display:none;background:#000000}
#photo img{width:100%;height:100%;object-fit:contain;display:block}
body.idle{cursor:none}
.bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:12px;background:rgba(12,12,12,.9);border:1px solid #2a2a2a;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:opacity .3s;max-width:calc(100% - 24px)}
body.idle .bar{opacity:0;pointer-events:none}
.bar button{height:34px;min-width:34px;padding:0 10px;border-radius:8px;border:1px solid #333333;background:transparent;color:#ffffff;font:inherit;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.bar button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.bar .name{padding:0 10px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.bar .count{color:#8e8e8e;font-variant-numeric:tabular-nums;padding-right:6px}
.help{position:fixed;left:50%;top:18px;transform:translateX(-50%);font-size:12px;color:#bdbdbd;background:rgba(12,12,12,.85);border:1px solid #2a2a2a;padding:6px 12px;border-radius:9px;transition:opacity .3s;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
body.idle .help{opacity:0}
:focus-visible{outline:2px solid #ffffff;outline-offset:2px}
</style>
</head>
<body>
<div id="stage" aria-live="polite"></div>
<div id="photo"><img alt=""></div>
<div class="help" id="help"></div>
<div class="bar" role="toolbar">
  <button type="button" id="prev" aria-label="←"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="name" id="name"></div><div class="count" id="count"></div>
  <button type="button" id="next" aria-label="→"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <button type="button" id="fs"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span id="fsLabel"></span></button>
</div>
<script src="i18n.js"></script>
<script src="venn-data.js"></script>
<script src="wm-data.js"></script>
<script src="patterns.js"></script>
<script>
(function () {
  "use strict";
  const PLP = window.PL_PATTERNS, I18N = window.PL_I18N;
  const q = new URLSearchParams(location.search);
  let LANG = I18N[q.get("lang")] ? q.get("lang") : "it";
  const t = (k) => (I18N[LANG] && I18N[LANG][k] != null ? I18N[LANG][k] : I18N.it[k] != null ? I18N.it[k] : k);
  const KEYS = PLP.ORDER.map((o) => o[0]);
  let idx = Math.max(0, KEYS.indexOf(q.get("k") || "screenLight"));
  let photo = null, inDialog = false;
  // Formato: fisso se scelto nel pannello (4:3, 16:9, 3:1), altrimenti quello reale della finestra
  let fixed = PLP.FORMATS[q.get("f")] ? q.get("f") : "";
  const stage = document.getElementById("stage");

  function labels() { const o = {}; Object.keys(I18N.it).forEach((k) => { if (k.startsWith("p.")) o[k] = t(k); }); return o; }
  // Il pattern si adatta al formato reale dello schermo: i bordi coincidono con i bordi del proiettore
  function render() {
    const key = KEYS[idx];
    const r = Math.min(3, Math.max(1, innerWidth / Math.max(1, innerHeight)));
    const W = fixed ? PLP.FORMATS[fixed] : r * PLP.H;
    stage.innerHTML = PLP.toSVG(PLP.build(key, W, labels()), W, { par: fixed ? "xMidYMid meet" : "none", attrs: ' role="img" aria-label="' + t("p." + key + ".name") + '"' });
    const ph = document.getElementById("photo");
    ph.style.display = key === "photo" && photo ? "block" : "none";
    if (photo) ph.querySelector("img").src = photo;
    document.getElementById("name").textContent = t("p." + key + ".name");
    document.getElementById("count").textContent = (idx + 1) + "/" + KEYS.length;
    document.getElementById("help").textContent = t("win.hint");
    document.getElementById("fsLabel").textContent = t("win.fs");
    document.documentElement.lang = LANG;
  }
  function tellParent() {
    const msg = { uspl: 1, from: "show", k: KEYS[idx] };
    try { if (inDialog) { Office.context.ui.messageParent(JSON.stringify({ k: KEYS[idx] })); return; } } catch (e) { /* non in PowerPoint */ }
    try { if (window.opener && !window.opener.closed) window.opener.postMessage(msg, location.origin === "null" ? "*" : location.origin); } catch (e) { /* finestra principale chiusa */ }
  }
  function go(d) { idx = (idx + d + KEYS.length) % KEYS.length; render(); tellParent(); wake(); }
  function apply(m) {
    if (!m) return;
    if (m.lang && I18N[m.lang]) LANG = m.lang;
    if (m.photo) photo = m.photo;
    if (m.f != null) fixed = PLP.FORMATS[m.f] ? m.f : "";
    if (m.k && KEYS.includes(m.k)) idx = KEYS.indexOf(m.k);
    render();
  }
  function toggleFs() {
    const d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const e = d.documentElement; const f = e.requestFullscreen || e.webkitRequestFullscreen; if (f) { const p = f.call(e); if (p && p.catch) p.catch(() => {}); } }
  }

  // Barra e cursore spariscono dopo qualche secondo, così non disturbano la misura
  let idleT;
  function wake() { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 2500); }
  addEventListener("mousemove", wake);
  addEventListener("resize", render);
  addEventListener("keydown", (e) => {
    if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); go(1); }
    else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); go(-1); }
    else if (e.key === "f" || e.key === "F") toggleFs();
    else if (e.key === "Home") { idx = 0; render(); tellParent(); }
  });
  stage.addEventListener("dblclick", toggleFs);
  document.getElementById("prev").onclick = () => go(-1);
  document.getElementById("next").onclick = () => go(1);
  document.getElementById("fs").onclick = toggleFs;
  addEventListener("message", (e) => { if (e.data && e.data.uspl && e.data.from !== "show") apply(e.data); });

  render(); wake();
  if (window.Office && Office.onReady) {
    Office.onReady(() => {
      try {
        if (Office.context && Office.context.ui && Office.context.ui.messageParent) {
          inDialog = !!(window.opener === null && Office.context.requirements);
          Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, (a) => {
            try { apply(JSON.parse(a.message)); } catch (e) { /* messaggio non valido */ }
          }, (r) => { if (r.status !== Office.AsyncResultStatus.Succeeded) inDialog = false; });
        }
      } catch (e) { inDialog = false; }
    });
  }
})();
</script>
</body>
</html>
